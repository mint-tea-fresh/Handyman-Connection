services:
  - type: web
    name: sow-jobber-mcp
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn jobber_mcp.runtime:create_application --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sow-jobber-mcp-db
          property: connectionString
      - key: JOBBER_CLIENT_ID
        sync: false
      - key: JOBBER_CLIENT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: JOBBER_API_VERSION
        value: 2025-04-16
      - key: EXPORT_DIR
        value: /tmp/jobber-exports

databases:
  - name: sow-jobber-mcp-db
    plan: free
    databaseName: sow_jobber_mcp
    user: sow_jobber_mcp
    ipAllowList: []
